[platformio]
; Compatibilidade opcional. O fluxo principal agora usa Arduino IDE.
default_envs = esp32cam
src_dir = .
include_dir = EstacionamentoCam

[env:esp32cam]
platform = espressif32 @ 6.13.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<EstacionamentoCam/>
; Base fixa: Arduino-ESP32 2.0.17, conforme release oficial da plataforma.
; Camera e Wi-Fi utilizarao componentes fornecidos pelo framework.
; Biblioteca WS2812B sera adicionada na etapa de integracao dos LEDs.

; Diagnostico isolado de CPU/UART. Selecionar explicitamente para gravar.
[env:esp32cam-serial-check]
extends = env:esp32cam
build_src_filter = -<*> +<SerialCheck/>
build_unflags = -DBOARD_HAS_PSRAM
