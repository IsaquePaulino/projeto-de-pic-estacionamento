[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-monitor-backend"
version = "0.3.0"
description = "Projeto de PIC Estacionamento: video local e ocupacao com ESP32-CAM e OpenCV"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ui = ["playwright>=1.56,<2"]

[project.scripts]
parking-capture = "parking_monitor.capture:main"

[tool.setuptools.packages.find]
where = ["src"]
